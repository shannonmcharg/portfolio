ame: Deploy to GitHub Pages

on:
  push:
    branches: [ "main", "gh-pages" ]
  pull_request:
    branches: [ "main", "gh-pages" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
Save, then commit and push:


git add .github/workflows/deploy.yml
git commit -m "Add GitHub Pages deployment workflow"
git push origin gh-pages
Ah, I see the confusion! When I created the file, it was created in the Lovable environment, not directly in your GitHub repository. You need to manually create this file in your local repository.

Create the workflow file manually:


mkdir -p .github/workflows
nano .github/workflows/deploy.yml
Then copy and paste this content:


name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main", "gh-pages" ]
  pull_request:
    branches: [ "main", "gh-pages" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
Save, then commit and push:


git add .github/workflows/deploy.yml
git commit -m "Add GitHub Pages deployment workflow"
git push origin gh-pages



